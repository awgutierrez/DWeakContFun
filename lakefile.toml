name = "DWeakContFun"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["DWeakContFun"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc2"

[[lean_lib]]
name = "DWeakContFun"
roots = [
  "NormSupport",
  "MetricFunctional",
  "DWeak",
  "Tent",
  "DWeakContFun"
]